# dataset_obb.yaml — YOLO11-OBB 학습용 데이터셋 설정
# step2_obb_labeler.py 로 생성한 OBB 라벨을 사용합니다.
#
# 구조:
#   data/dataset_obb/images/train/  → data/dataset/images/train/ 심볼릭 링크
#   data/dataset_obb/labels/train/  → OBB 라벨 (.txt, 9값: class x1 y1 x2 y2 x3 y3 x4 y4)
# YOLO는 이미지 경로의 /images/ → /labels/ 자동 치환으로 라벨을 찾습니다.

train: data/dataset_obb/images/train
val:   data/dataset_obb/images/val

nc: 2

names:
  0: "8pin_socket"
  1: "12pin_socket"
